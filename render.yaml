# Render Blueprint - 一键部署配置
# 将项目推送到 GitHub 后，在 Render 中连接仓库即可自动部署

services:
  # 后端服务
  - type: web
    name: project-ai-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    healthCheckPath: /health

  # 前端静态站点
  - type: static
    name: project-ai-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://project-ai-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://project-ai-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html